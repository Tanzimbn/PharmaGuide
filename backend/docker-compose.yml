services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pharmaguide-db
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharmaguide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharmaguide"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
